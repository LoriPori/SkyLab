<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#33b0ea">
<title>Skylab — Weather & Science</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif&family=Schibsted+Grotesk:wght@400;500;600&display=swap">
<style>
@property --a{syntax:'<color>';inherits:true;initial-value:#33b0ea}
@property --b{syntax:'<color>';inherits:true;initial-value:#a8dcf5}
@property --acc{syntax:'<color>';inherits:true;initial-value:#1d5f8c}
:root{--a:#33b0ea;--b:#a8dcf5;--acc:#1d5f8c;--ink:#14314f;--mut:rgba(20,49,79,.66);
--serif:"Instrument Serif",Georgia,serif;--sans:"Schibsted Grotesk",system-ui,sans-serif;
transition:--a 1.4s,--b 1.4s,--acc 1.4s}
*{box-sizing:border-box;margin:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);color:#fff;min-height:100vh;background:linear-gradient(170deg,var(--a),var(--b)) fixed;-webkit-font-smoothing:antialiased;overflow-x:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0}
:focus-visible{outline:2px solid #fff;outline-offset:2px}
::selection{background:rgba(255,255,255,.35)}

/* ambient layers */
.aurora{position:fixed;inset:-20%;z-index:0;pointer-events:none;
background:radial-gradient(40vmax 40vmax at 18% 22%,rgba(255,255,255,.38),transparent 62%),radial-gradient(34vmax 34vmax at 82% 68%,rgba(255,255,255,.24),transparent 62%);
animation:aur 28s ease-in-out infinite alternate}
@keyframes aur{to{transform:translate3d(6%,4%,0) rotate(8deg) scale(1.1)}}
#fx{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:0}
#orb{position:fixed;width:120px;height:120px;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;z-index:0;opacity:0;
transition:left 1s cubic-bezier(.2,.7,.2,1),top 1s cubic-bezier(.2,.7,.2,1),opacity .7s,background .7s}
#orb.sun{background:radial-gradient(circle,#fffbe6 0 28%,#ffe08a 55%,rgba(255,224,138,0) 72%);animation:glow 5s ease-in-out infinite}
#orb.moon{width:76px;height:76px;background:radial-gradient(circle at 35% 35%,#fff,#e4eaff 55%,#c5cfee);box-shadow:0 0 80px 22px rgba(210,220,255,.45);animation:glow 6s ease-in-out infinite}
@keyframes glow{50%{transform:translate(-50%,-50%) scale(1.12)}}

.wrap{position:relative;z-index:1;max-width:1100px;margin:0 auto;padding:12px 20px 26px}

/* header */
header{position:sticky;top:0;z-index:10;display:flex;gap:10px;align-items:center;flex-wrap:wrap;padding:10px 20px;margin:0 -20px;border-radius:0 0 22px 22px;transition:background .35s,box-shadow .35s}
header.stuck{background:rgba(255,255,255,.2);backdrop-filter:blur(18px);box-shadow:0 8px 30px rgba(10,40,90,.12)}
.logo{font-family:var(--serif);font-size:28px;margin-right:auto;cursor:pointer;display:flex;align-items:center;gap:9px;text-shadow:0 2px 14px rgba(10,30,60,.25)}
.lg{width:14px;height:14px;border-radius:50%;background:#fff3b0;box-shadow:0 0 0 0 rgba(255,243,176,.8);animation:ping2 2.6s infinite}
@keyframes ping2{70%{box-shadow:0 0 0 12px rgba(255,243,176,0)}100%{box-shadow:0 0 0 0 rgba(255,243,176,0)}}
.search{position:relative;flex:1 1 280px;max-width:420px}
.search input{width:100%;padding:11px 40px 11px 40px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.26);backdrop-filter:blur(14px);color:#fff;font:inherit;font-size:15px}
.search input::placeholder{color:rgba(255,255,255,.85)}
.search>svg{position:absolute;left:14px;top:12px;width:18px}
.search kbd{position:absolute;right:12px;top:10px;font:12px var(--sans);border:1px solid rgba(255,255,255,.5);border-radius:6px;padding:2px 7px;color:rgba(255,255,255,.9)}
.sugg{position:absolute;left:0;right:0;top:calc(100% + 8px);background:rgba(255,255,255,.97);color:var(--ink);border-radius:18px;overflow:hidden;z-index:5;display:none;box-shadow:0 20px 50px rgba(10,40,90,.25)}
.sugg.on{display:block;animation:rise .25s both}
.sugg button{display:block;width:100%;text-align:left;padding:11px 16px;font-size:14px}
.sugg button small{color:var(--mut);margin-left:6px}
.sugg button:hover,.sugg button[aria-selected=true]{background:rgba(20,49,79,.08)}
.sugg .hd{padding:10px 16px;font-size:13px;color:var(--mut)}
.pill{padding:10px 16px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24);backdrop-filter:blur(12px);font-size:14px;font-weight:500;white-space:nowrap;transition:transform .2s,background .25s}
.pill:hover{background:rgba(255,255,255,.38);transform:translateY(-2px)}
.pill:active{transform:scale(.95)}
.pill.solid{background:#fff;color:var(--acc);font-weight:600}
.pill.big{padding:15px 26px;font-size:16px}
.pill.dk{background:rgba(20,49,79,.07);border-color:rgba(20,49,79,.14);color:var(--ink)}
.pill.dk:hover{background:rgba(20,49,79,.13)}
.pill[aria-pressed=true].sndb{background:#fff;color:var(--acc)}
.seg{display:flex;padding:3px;border-radius:999px;border:1px solid rgba(255,255,255,.5);background:rgba(255,255,255,.24)}
.seg button{padding:7px 12px;border-radius:999px;font-size:14px;transition:background .25s,color .25s}
.seg button[aria-pressed=true]{background:#fff;color:var(--acc);font-weight:600}

/* hero */
.hero{display:grid;grid-template-columns:1.2fr 1fr;gap:10px;align-items:center;min-height:clamp(290px,42vh,410px);margin-top:10px;--px:0;--py:0;text-shadow:0 2px 16px rgba(10,30,60,.26)}
.place{display:flex;align-items:center;gap:8px}
.place h1{font-weight:500;font-size:23px}
.star{font-size:22px;color:#fff3b0;transition:transform .35s}
.star:hover{transform:rotate(72deg) scale(1.25)}
.sub{font-size:14px;color:rgba(255,255,255,.92);margin-top:2px}
.temp{font-family:var(--serif);font-size:clamp(96px,14vw,164px);line-height:.95;letter-spacing:-.02em;margin:8px 0 0 -4px;text-shadow:0 8px 40px rgba(10,30,60,.22)}
.temp sup{font-size:.34em;vertical-align:top;position:relative;top:.2em;margin-left:4px}
.cond{display:flex;align-items:center;gap:10px;font-size:22px}
.cond .em{display:inline-flex;font-size:34px}
.feels{font-size:15px;margin-top:4px;color:rgba(255,255,255,.93)}
.lede{font-family:var(--serif);font-size:22px;line-height:1.35;max-width:30ch;margin-top:10px}
.tt{margin-top:16px;max-width:380px}
.tt input{width:100%;height:8px;-webkit-appearance:none;appearance:none;border-radius:9px;background:rgba(255,255,255,.35);cursor:pointer}
.tt input::-webkit-slider-thumb{-webkit-appearance:none;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 3px 14px rgba(10,30,60,.35);transition:transform .2s}
.tt input::-moz-range-thumb{width:24px;height:24px;border:0;border-radius:50%;background:#fff;box-shadow:0 3px 14px rgba(10,30,60,.35)}
.tt input:hover::-webkit-slider-thumb,.tt input:active::-webkit-slider-thumb{transform:scale(1.22)}
.tl{margin-top:8px;font-size:13px;color:rgba(255,255,255,.92)}
.scene{display:flex;flex-direction:column;align-items:center;gap:16px}
.bigwrap{position:relative;display:grid;place-items:center;font-size:clamp(130px,20vw,240px);width:1em;height:1em}
.halo{position:absolute;inset:8%;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:haloP 3.8s ease-out infinite}
.halo::after{content:"";position:absolute;inset:-2px;border-radius:50%;border:2px solid rgba(255,255,255,.55);animation:haloP 3.8s 1.9s ease-out infinite}
@keyframes haloP{from{transform:scale(.8);opacity:.9}to{transform:scale(1.45);opacity:0}}
.bigic{font-size:1em;display:grid;place-items:center;transform:translate(calc(var(--px)*16px),calc(var(--py)*12px));transition:transform .25s}
.bigic .ic{width:1em;height:1em;stroke-width:.9;filter:drop-shadow(0 10px 26px rgba(255,255,255,.45))}
.ncbox{display:flex;align-items:center;gap:14px;padding:10px 16px;border-radius:18px;background:rgba(255,255,255,.24);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(12px);font-size:14px}
.ncbox .nb{display:flex;align-items:flex-end;gap:4px;height:30px}
.ncbox .nb i{width:6px;border-radius:3px;background:#fff;transform-origin:bottom;animation:gy .8s cubic-bezier(.2,.7,.2,1) both}

/* ticker & tabs */
.ticker{margin:4px 0 12px;min-height:26px;font-size:14px;display:flex;gap:9px;align-items:baseline;cursor:pointer;transition:opacity .4s,transform .4s;text-shadow:0 2px 12px rgba(10,30,60,.25)}
.ticker.out{opacity:0;transform:translateY(7px)}
.ticker b{font-weight:600;white-space:nowrap}
.ticker .tkb{opacity:.92;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.spark{display:inline-block;animation:spin 6s linear infinite}
.tabs{position:relative;display:flex;gap:2px;padding:4px;border-radius:999px;background:rgba(255,255,255,.25);border:1px solid rgba(255,255,255,.45);backdrop-filter:blur(12px);width:max-content;max-width:100%;overflow-x:auto;margin-bottom:14px}
.tab{position:relative;z-index:1;padding:9px 18px;border-radius:999px;font-size:14px;font-weight:500;white-space:nowrap;transition:color .3s}
.tab[aria-selected=true]{color:var(--acc);font-weight:600}
.ind{position:absolute;top:4px;bottom:4px;left:4px;width:70px;border-radius:999px;background:#fff;box-shadow:0 6px 18px rgba(10,40,90,.18);transition:left .5s cubic-bezier(.3,1.3,.4,1),width .5s cubic-bezier(.3,1.3,.4,1)}

/* cards */
.pane{display:grid;gap:14px}
.g2{grid-template-columns:1.5fr 1fr}.g2e{grid-template-columns:1fr 1fr}
.card{position:relative;padding:20px;border-radius:26px;background:rgba(255,255,255,.72);color:var(--ink);text-shadow:none;border:1px solid rgba(255,255,255,.8);backdrop-filter:blur(18px) saturate(1.5);box-shadow:0 22px 50px -28px rgba(10,40,90,.45);
animation:rise .6s cubic-bezier(.2,.7,.2,1) both;transition:transform .35s cubic-bezier(.2,.7,.2,1),box-shadow .35s;overflow:hidden}
.pane>.card:nth-child(2){animation-delay:.1s}
.card:hover{transform:translateY(-4px);box-shadow:0 30px 60px -28px rgba(10,40,90,.5)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;opacity:0;transition:opacity .3s;background:radial-gradient(260px circle at var(--mx,50%) var(--my,50%),rgba(255,255,255,.75),transparent 65%)}
.card:hover::before{opacity:1}
.card>*{position:relative}
h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut);margin-bottom:12px;font-weight:600}
.note{color:var(--mut);font-size:14px;line-height:1.55;margin-top:8px}
.sk{animation:pulse 1.2s infinite alternate}
@keyframes pulse{from{opacity:.4}to{opacity:.9}}

/* today */
.strip{display:grid;grid-template-columns:auto repeat(4,1fr);gap:16px;align-items:center;padding-bottom:14px;margin-bottom:10px;border-bottom:1px solid rgba(20,49,79,.1)}
.ringw{text-align:center}.ringw small{display:block;font-size:12px;color:var(--mut);margin-top:-2px}
.rg{animation:ringIn 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes ringIn{from{stroke-dashoffset:var(--C)}}
.mini span{font-size:12px;color:var(--mut)}
.mini b{display:flex;align-items:center;gap:6px;font-family:var(--serif);font-weight:400;font-size:26px;line-height:1.2}
.mini small{font-size:12px;color:var(--mut)}
.bar2{height:5px;border-radius:9px;background:rgba(20,49,79,.12);margin-top:6px;overflow:hidden}
.bar2 i{display:block;height:100%;width:var(--w);background:var(--acc);border-radius:9px;animation:gw 1.2s cubic-bezier(.2,.7,.2,1) both}
.wind{width:22px;height:22px;transform:rotate(var(--r));animation:aim 1.6s cubic-bezier(.3,1.4,.4,1) both;color:var(--acc)}
@keyframes aim{from{transform:rotate(-220deg)}}
.chartbox{position:relative}
.tlegend{display:flex;align-items:center;gap:10px;margin-top:6px;font-size:12px;color:var(--mut)}
.tgbar{flex:1;height:6px;border-radius:9px}
.rb{transform-box:fill-box;transform-origin:bottom;animation:gy .8s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i)*25ms)}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:dr 2s .2s cubic-bezier(.4,0,.2,1) forwards}
@keyframes dr{to{stroke-dashoffset:0}}
.tip{position:absolute;top:-6px;transform:translateX(-50%);padding:7px 11px;border-radius:12px;background:var(--ink);color:#fff;font-size:13px;pointer-events:none;opacity:0;transition:opacity .2s,left .08s;white-space:nowrap;text-align:center;z-index:2}
.tip small{opacity:.75}
.side{display:flex;flex-direction:column;gap:12px}
.arc{stroke-dasharray:4 6;animation:dash 2s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.glow{animation:gl2 2.4s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes gl2{50%{transform:scale(1.5);opacity:.1}}
.moonrow{display:flex;gap:12px;align-items:center;font-size:14px}
.moonrow .ic{font-size:36px}.moonrow small{display:block;color:var(--mut);font-size:12px}
.best{font-size:14px;line-height:1.5}.best b{font-family:var(--serif);font-weight:400;font-size:19px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{display:inline-flex;gap:7px;align-items:center;padding:8px 13px;border-radius:999px;background:rgba(255,255,255,.85);font-size:13.5px;animation:pop .55s cubic-bezier(.3,1.5,.4,1) both;animation-delay:calc(var(--n)*90ms + 300ms);transition:transform .25s}
.chip:hover{transform:translateY(-3px) rotate(-2deg)}
.chip .ic{font-size:17px}
@keyframes pop{from{opacity:0;transform:scale(.6)}}

/* week */
.story{font-family:var(--serif);font-size:21px;line-height:1.35;margin-bottom:10px;max-width:46ch}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.dcol{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px 4px;border-radius:18px;font-size:14px;animation:rise .6s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*70ms);transition:background .25s,transform .25s}
.dcol:hover{background:rgba(255,255,255,.8);transform:translateY(-5px)}
.dcol .dic{font-size:26px;display:flex}
.dcol .hi{font-weight:600}.dcol .lo,.dcol small{color:var(--mut)}.dcol small{font-size:12px;color:#3b8fe0}
.dbar{position:relative;width:9px;height:110px;border-radius:9px;background:rgba(20,49,79,.1)}
.dbar i{position:absolute;left:0;right:0;bottom:var(--lo);height:var(--h);border-radius:9px;animation:gy .9s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*70ms + 200ms)}
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;scrollbar-width:thin}
.hr{flex:0 0 62px;text-align:center;padding:10px 0;border-radius:16px;font-size:14px;transition:background .2s,transform .2s;animation:rise .5s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*28ms)}
.hr:hover{background:rgba(255,255,255,.8);transform:translateY(-3px)}
.hr:first-child{background:rgba(255,255,255,.75)}
.hr .t{color:var(--mut);font-size:13px}.hr .e{font-size:24px;margin:6px 0;display:flex;justify-content:center}.hr .p{font-size:11px;color:#3b8fe0;height:14px}

/* air & pollen */
.gauge svg{width:100%;max-width:280px;display:block;margin:0 auto}
.gfill{animation:gf 1.6s cubic-bezier(.2,.7,.2,1) both}
@keyframes gf{from{stroke-dashoffset:100}}
.needle{transform-origin:100px 100px;transform:rotate(var(--r));animation:needle 1.8s cubic-bezier(.3,1.4,.4,1) both}
@keyframes needle{from{transform:rotate(-90deg)}}
.aq{text-align:center;font-family:var(--serif);font-size:54px;line-height:1;margin-top:-4px}
.aq small{font-family:var(--sans);font-size:16px;margin-left:10px}
.pl{display:grid;gap:11px;margin-top:12px}
.pr{display:grid;grid-template-columns:120px 1fr 86px;align-items:center;gap:12px;font-size:14px}
.pr span{white-space:nowrap}
.pb{height:16px;border-radius:9px;background:rgba(20,49,79,.1);overflow:hidden}
.pb i{position:relative;display:block;height:100%;width:var(--w);border-radius:9px;overflow:hidden;animation:gw 1.1s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--n)*80ms)}
.pb i::after{content:"";position:absolute;top:0;bottom:0;left:0;width:45%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);transform:translateX(-120%);animation:shim 3.2s ease-in-out infinite}
@keyframes shim{0%{transform:translateX(-120%)}55%,100%{transform:translateX(320%)}}
.pb i.lv0{background:#4fd18b}.pb i.lv1{background:#f0cf45}.pb i.lv2{background:#f59a3a}.pb i.lv3{background:#e5652e}
.pr b{text-align:right;font-weight:600;font-size:13px}
.src{display:inline-block;margin-top:12px;font-size:12px;color:var(--mut);border:1px solid rgba(20,49,79,.16);border-radius:99px;padding:3px 10px}

/* science */
.sw{display:inline-flex;padding:3px;border-radius:999px;background:rgba(20,49,79,.08);margin-bottom:14px}
.sw button{padding:7px 14px;border-radius:999px;font-size:13.5px;transition:background .25s,color .25s}
.sw button[aria-pressed=true]{background:#fff;color:var(--acc);font-weight:600;box-shadow:0 4px 12px rgba(10,40,90,.12)}
#sbody{animation:rise .5s both}
.tag{display:inline-block;font-size:12px;border:1px solid rgba(20,49,79,.18);border-radius:99px;padding:3px 10px;color:var(--mut)}
.fh{font-family:var(--serif);font-weight:400;font-size:30px;line-height:1.15;margin:10px 0}
.fp{font-size:15px;line-height:1.6;color:var(--mut)}
.fnav{display:flex;gap:8px;margin-top:16px}
.qs{font-family:var(--serif);font-size:25px;line-height:1.25;margin-bottom:14px}
.qb{display:flex;gap:10px}.qr{margin-top:12px;color:var(--mut);font-size:14px;line-height:1.55}.qr b{color:var(--ink)}
.sc{margin-top:10px;font-size:12px;color:var(--mut)}
.labgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.st{padding:12px 14px;border-radius:16px;background:rgba(255,255,255,.65);transition:transform .25s,background .25s;animation:rise .55s both;animation-delay:calc(var(--n)*70ms)}
.st:hover{transform:translateY(-3px);background:#fff}
.st b{display:block;font-family:var(--serif);font-weight:400;font-size:26px;margin:2px 0}
.st span{font-size:12px;color:var(--mut);line-height:1.35;display:block}

/* landing */
.land h1{font-family:var(--serif);font-weight:400;font-size:clamp(56px,10vw,108px);line-height:.95;letter-spacing:-.02em;
background:linear-gradient(100deg,#fff 30%,#fff3c4 50%,#fff 70%);background-size:250% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:shine 6s linear infinite;filter:drop-shadow(0 4px 22px rgba(10,30,60,.25))}
@keyframes shine{to{background-position:-250% 0}}
.lp{font-size:19px;line-height:1.5;max-width:40ch;margin:18px 0 24px}
.cta{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:26px}
.marq{overflow:hidden;margin-top:14px;-webkit-mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent);mask-image:linear-gradient(90deg,transparent,#000 8%,#000 92%,transparent)}
.track{display:flex;gap:12px;width:max-content;animation:marq 50s linear infinite}
.track:hover{animation-play-state:paused}
@keyframes marq{to{transform:translateX(-50%)}}
.cityc{display:flex;gap:10px;align-items:center;padding:12px 18px;border-radius:999px;background:rgba(255,255,255,.28);border:1px solid rgba(255,255,255,.55);backdrop-filter:blur(10px);white-space:nowrap;transition:transform .25s,background .25s;text-shadow:0 1px 10px rgba(10,30,60,.2)}
.cityc:hover{transform:translateY(-4px) scale(1.04);background:rgba(255,255,255,.45)}
.cityc .ic{font-size:26px}.cityc b{font-family:var(--serif);font-weight:400;font-size:26px}.cityc small{opacity:.9}

/* icons */
.ic{width:1em;height:1em;display:inline-block;vertical-align:-.14em;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.i-sun{color:#f2a51a;animation:spin 26s linear infinite}.i-moon{color:#6b7bd6;animation:sway 6s ease-in-out infinite}
.i-rain,.i-drizzle,.i-drop,.i-umbrella{color:#3b8fe0}.i-rain,.i-drizzle{animation:bobi 2.4s ease-in-out infinite}
.i-storm{color:#e0a100;animation:zap 3.2s infinite}.i-snow,.i-flake{color:#5aa7d6}.i-snow{animation:bobi 3s ease-in-out infinite}
.i-partly{color:#e8a93a;animation:sway 6s ease-in-out infinite}.i-cloud{color:#6f8aa8;animation:sway 7s ease-in-out infinite}.i-fog{color:#8aa0b5;animation:sway 5s ease-in-out infinite}
.i-tshirt,.i-layers,.i-jacket{color:#e0892f}.i-wind{color:#3fa3b5}.i-walk{color:#3fae7a}
.hero .ic,.cityc .ic{color:#fff}
@keyframes spin{to{transform:rotate(360deg)}}

function heroLine(){

function story(){

 return`This week: ${sky}. Warmest ${nm[hi]} at ${T(d.temperature_2m_max[hi])}°, coolest ${nm[lo]} at ${T(d.temperature_2m_min[lo])}°.`;
}
function moon(){
 const syn=29.530588853,p=((((Date.now()-Date.UTC(2000,0,6,18,14))/864e5)%syn)+syn)%syn/syn;
 const names=['New moon','Waxing crescent','First quarter','Waxing gibbous','Full moon','Waning gibbous','Last quarter','Waning crescent'];
 return{n:names[Math.round(p*8)%8],lit:Math.round((1-Math.cos(2*Math.PI*p))/2*100),p};
}
function moonIcon(){
 const p=moon().p,k=Math.cos(2*Math.PI*p),rx=(9*Math.abs(k)).toFixed(2),w=p<.5,o=w?1:0,i=w?(k>0?0:1):(k>0?1:0);
 return`<svg class="ic" viewBox="0 0 24 24" aria-hidden="true" style="animation:none"><circle cx="12" cy="12" r="9" style="fill:rgba(20,49,79,.08);stroke:rgba(20,49,79,.3)"/><path d="M12 3A9 9 0 0 ${o} 12 21A${rx} 9 0 0 ${i} 12 3z" style="fill:#6b7bd6;stroke:none"/></svg>`;
}
function comfortInfo(){
 const c=data.current,h=data.hourly,i0=idx0();
 const rain=Math.max(...h.precipitation_probability.slice(i0,i0+6));
 const s=Math.max(0,Math.round(100-Math.min(45,Math.abs(c.temperature_2m-21)*3.2)-Math.max(0,c.dew_point_2m-16)*3-Math.max(0,c.wind_speed_10m-20)*.9-rain*.25));
 let best=-1,bs=-1e9;
 for(let i=i0;i<i0+24&&i<h.time.length;i++){
  if(!h.is_day[i])continue;
  const sc=100-Math.abs(h.temperature_2m[i]-21)*3.2-h.precipitation_probability[i]*.6;
  if(sc>bs){bs=sc;best=i}
 }
 return{s,lab:s>=80?'Excellent':s>=60?'Comfortable':s>=40?'So-so':'Rough',best};
}
function advice(){
 const c=data.current,h=data.hourly,i0=idx0(),rain=Math.max(...h.precipitation_probability.slice(i0,i0+10)),uv=data.daily.uv_index_max[0],t=c.apparent_temperature,v=c.wind_speed_10m,a=[];
 a.push(t>=27?['tshirt','Shorts and a light tee']:t>=20?['tshirt','T-shirt weather']:t>=13?['layers','Long sleeves']:t>=6?['jacket','Warm jacket']:['flake','Heavy coat, hat, gloves']);
 if(rain>=40)a.push(['umbrella',rain>=70?'Waterproof jacket':'Take an umbrella']);
 if(uv>=3&&c.is_day)a.push(['sun',uv>=6?'Sunscreen and sunglasses':'Sunglasses']);
 if(v>=35)a.push(['wind','Windproof layer']);
 if(c.temperature_2m>=28)a.push(['drop','Drink plenty of water']);
 if(c.temperature_2m<=2)a.push(['flake','Ice risk outside']);
 if(a.length==1&&rain<40)a.push(['walk','Good for a walk']);
 return a.slice(0,5).map(([i,s],n)=>`<span class="chip" style="--n:${n}">${ic(i)}${s}</span>`).join('');
}
function lab(){
 const c=data.current,d=data.daily,tC=c.temperature_2m,td=c.dew_point_2m,v=c.wind_speed_10m,rh=c.relative_humidity_2m;
 const comfort=td<10?'Dry and comfortable':td<16?'Pleasant':td<18?'Slightly humid':td<21?'Humid':'Oppressive';
 const cb=Math.max(0,(tC-td)*125),cbTxt=cb<60?'Fog level':unit=='c'?`~${Math.round(cb/10)*10} m`:`~${Math.round(cb*3.281/50)*50} ft`;
 let chill=null;if(tC<=10&&v>4.8){const p=Math.pow(v,.16);chill=13.12+.6215*tC-11.37*p+.3965*tC*p}
 const F=tC*9/5+32;let heat=null;
 if(F>=80&&rh>=40)heat=(-42.379+2.04901523*F+10.14333127*rh-.22475541*F*rh-.00683783*F*F-.05481717*rh*rh+.00122874*F*F*rh+.00085282*F*rh*rh-.00000199*F*F*rh*rh-32)*5/9;
 const feel=chill!==null?['Wind chill',T(chill)+'°','Wind strips heat from skin']:heat!==null?['Heat index',T(heat)+'°','Humidity slows sweat']:['Body heat','Neutral','No chill or heat stress'];
 const dl=(new Date(d.sunset[0])-new Date(d.sunrise[0]))/6e4,dl2=(new Date(d.sunset[1])-new Date(d.sunrise[1]))/6e4,df=Math.round((dl2-dl)*60);
 const tiles=[['Dew point',T(td)+'°',comfort],['Cloud base',cbTxt,'125 m per °C of spread'],feel,['Speed of sound',Math.round(331.3+.606*tC)+' m/s','Faster in warm air'],['Daylight',hm(dl),`Tomorrow ${df>=0?'+':'−'}${Math.abs(df)}s`],['Pressure',Math.round(c.surface_pressure)+' hPa',c.surface_pressure<1005?'Low, unsettled':c.surface_pressure>1020?'High, settled':'Near average']];
 return tiles.map(([a,b,s],n)=>`<div class="st" style="--n:${n}"><span>${a}</span><b>${b}</b><span>${s}</span></div>`).join('');
}

function chartSVG(){
 const h=data.hourly,i0=idx0();
 const v=h.temperature_2m.slice(i0,i0+25),pp=h.precipitation_probability.slice(i0,i0+25),tt=h.time.slice(i0,i0+25);
 const lo=Math.min(...v),hi=Math.max(...v),sp=hi-lo||1,n=v.length-1;
 const X=i=>24+i*(552/n),Y=x=>38+(hi-x)/sp*66;
 let d=`M${X(0)},${Y(v[0])}`;
 for(let i=1;i<=n;i++){const m=(X(i-1)+X(i))/2;d+=` C${m},${Y(v[i-1])} ${m},${Y(v[i])} ${X(i)},${Y(v[i])}`}
 const bars=pp.map((p,i)=>`<rect class="rb" style="--i:${i}" x="${X(i)-4}" y="${140-p*.3}" width="8" height="${Math.max(0,p*.3)}" rx="3" fill="#3b8fe0" opacity=".28"/>`).join('');

 const stops=v.map((x,i)=>`<stop offset="${pct(i)}" stop-color="${tempColor(x)}"/>`).join('');
 const areaStops=v.map((x,i)=>`<stop offset="${pct(i)}" stop-color="${tempColor(x)}" stop-opacity=".3"/>`).join('');
 const pts=v.map((x,i)=>i%4==0?`<circle cx="${X(i)}" cy="${Y(x)}" r="4.5" fill="${tempColor(x)}" stroke="#fff" stroke-width="1.5"/><text x="${X(i)}" y="${Y(x)-12}" text-anchor="middle" font-size="13" font-weight="600" fill="#14314f">${T(x)}°</text><text x="${X(i)}" y="162" text-anchor="middle" font-size="11" fill="rgba(20,49,79,.6)">${i?tt[i].slice(11,13)+'h':'Now'}</text>`:'').join('');
 return`<div class="chartbox"><svg viewBox="0 0 600 170" role="img" aria-label="Temperature over the next 24 hours" style="width:100%;height:auto;display:block"><defs>
 <linearGradient id="tgrad" gradientUnits="userSpaceOnUse" x1="${X(0)}" y1="0" x2="${X(n)}" y2="0">${stops}</linearGradient>
 <linearGradient id="agrad" gradientUnits="userSpaceOnUse" x1="${X(0)}" y1="0" x2="${X(n)}" y2="0">${areaStops}</linearGradient>
 <linearGradient id="ar" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
 <mask id="fade"><rect x="0" y="0" width="600" height="140" fill="url(#ar)"/></mask></defs>
 ${bars}<g mask="url(#fade)"><path d="${d} L${X(n)},140 L${X(0)},140Z" fill="url(#agrad)"/></g>
 <path d="${d}" pathLength="1" class="draw" fill="none" stroke="url(#tgrad)" stroke-width="3.5" stroke-linecap="round"/>${pts}</svg></div>
 <div class="tlegend"><span>Cooler</span><div class="tgbar" style="background:linear-gradient(90deg,${tempColor(lo)},${tempColor((lo+hi)/2)},${tempColor(hi)})"></div><span>Warmer</span><span style="margin-left:10px">▮ rain chance</span></div>`;
}

function scrub(){

 const ln=svg.querySelector('#sl');

  const r=svg.getBoundingClientRect(),x=(e.clientX-r.left)/r.width*600,i=Math.max(0,Math.min(n,Math.round((x-24)/(552/n))));
  const px=24+i*(552/n);ln.setAttribute('x1',px);ln.setAttribute('x2',px);ln.style.opacity=1;

let extras={key:'',air:'',pol:''};
const LOADING=t=>`<h3>${t}</h3><p class="note sk">Loading…</p>`;
function airPane(){return`<div class="pane g2e"><section class="card" id="aq">${extras.air||LOADING('Air quality')}</section><section class="card" id="pol">${extras.pol||LOADING('Pollen & allergies')}</section></div>`}
function putExtra(id,html){const el=$('#'+id);if(el){el.innerHTML=html;runCounters(el)}}
function loadExtras(){
 const key=place.lat+','+place.lon;
 if(extras.key===key&&extras.air&&extras.pol)return;
 extras={key,air:'',pol:''};sig.aqi=null;sig.pollen=null;
 loadAir().then(h=>{if(extras.key!==key)return;extras.air=h;putExtra('aq',h);
  const m=h.match(/data-cu="(\d+)"/);sig.aqi=m?+m[1]:null;checkAlerts()});
 loadPollen().then(h=>{if(extras.key!==key)return;extras.pol=h;putExtra('pol',h);checkAlerts()});
}
async function loadAir(){
 try{
  const r=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.lat}&longitude=${place.lon}&current=european_aqi,pm2_5,pm10`);
  const j=(await r.json()).current;if(!j||j.european_aqi==null)throw 0;
  const a=Math.round(j.european_aqi),pct=Math.max(3,Math.min(100,a)),rot=-90+Math.min(100,a)*1.8;
  const lv=a<=20?['Good','Air is clean. Enjoy the outdoors.']:a<=40?['Fair','Fine for most people.']:a<=60?['Moderate','Sensitive people may notice effects.']:a<=80?['Poor','Consider shorter time outside.']:a<=100?['Very poor','Limit strenuous outdoor activity.']:['Extremely poor','Stay indoors if you can.'];
  return`<h3>Air quality</h3><div class="gauge"><svg viewBox="0 0 200 112" role="img" aria-label="Air quality index ${a}"><defs><linearGradient id="gg" gradientUnits="userSpaceOnUse" x1="20" y1="0" x2="180" y2="0"><stop offset="0" stop-color="#4fd18b"/><stop offset=".4" stop-color="#f3d34a"/><stop offset=".7" stop-color="#f59a3a"/><stop offset="1" stop-color="#e5652e"/></linearGradient></defs><path d="M20,100 A80,80 0 0 1 180,100" fill="none" stroke="rgba(20,49,79,.1)" stroke-width="14" stroke-linecap="round"/><path class="gfill" d="M20,100 A80,80 0 0 1 180,100" pathLength="100" fill="none" stroke="url(#gg)" stroke-width="14" stroke-linecap="round" stroke-dasharray="100" stroke-dashoffset="${100-pct}"/><g class="needle" style="--r:${rot}deg"><line x1="100" y1="100" x2="100" y2="34" stroke="#14314f" stroke-width="3" stroke-linecap="round"/><circle cx="100" cy="100" r="7" fill="#14314f"/></g></svg></div>
  <div class="aq"><span data-cu="${a}">0</span><small>${lv[0]}</small></div><p class="note" style="text-align:center">${lv[1]}</p><p class="note" style="text-align:center;font-size:13px">PM2.5 ${j.pm2_5} µg/m³ · PM10 ${j.pm10} µg/m³</p>`;
 }catch(e){return`<h3>Air quality</h3><p class="note">Not available for this place right now.</p>`}

/* Pollen: Atmospore first, Open-Meteo as fallback */
const POLLEN_RX=/pollen|tree|grass|weed|birch|alder|oak|olive|ragweed|mugwort|hazel|cypress|pine|plane|poplar|ash|elm|nettle|plantain|cedar|maple|mold|mould|spore|fungi|alternaria|cladosporium/i;
const CATS={none:0,'very low':0,low:0,moderate:1,medium:1,high:2,'very high':3,extreme:3,severe:3};
const numOf=o=>{for(const k of['index','level','value','count','concentration','risk','score']){const v=o[k];if(typeof v=='number')return v;if(typeof v=='string'&&v.trim()!==''&&!isNaN(+v))return+v}return null};
const catOf=o=>{for(const k of['category','label','risk','level','status','description']){const v=o[k];if(typeof v=='string'&&CATS[v.toLowerCase()]!==undefined)return v.toLowerCase()}return null};
function harvest(node,out,depth=0){
 if(node==null||depth>7)return;
 if(Array.isArray(node)){node.forEach(n=>harvest(n,out,depth+1));return}
 if(typeof node!='object')return;
 const nm=['name','type','plant','species','allergen','displayName','display_name','code'].map(k=>node[k]).find(v=>typeof v=='string');
 if(nm&&POLLEN_RX.test(nm)){const v=numOf(node),c=catOf(node);if(v!==null||c){out.push({n:nm,v,c});return}}
 for(const[k,v]of Object.entries(node)){
  if(typeof v=='number'&&POLLEN_RX.test(k)&&!/lat|lon|time/i.test(k))out.push({n:k,v,c:null});
  else if(typeof v=='string'&&POLLEN_RX.test(k)&&CATS[v.toLowerCase()]!==undefined)out.push({n:k,v:null,c:v.toLowerCase()});
  else if(v&&typeof v=='object'&&!Array.isArray(v)&&POLLEN_RX.test(k)&&(numOf(v)!==null||catOf(v)))out.push({n:k,v:numOf(v),c:catOf(v)});
  else harvest(v,out,depth+1);
 }
}
const pretty=s=>{s=s.replace(/[_-]+/g,' ').replace(/\bpollen\b/i,'').trim();return s?s[0].toUpperCase()+s.slice(1).toLowerCase():'Pollen'};
function pLevel(v){if(v<=20)return 0;if(v<=50)return 1;if(v<=100)return 2;return 3}
const LVL=['Low','Moderate','High','Very high'];
function normalize(list){
 const m=new Map();
 list.forEach(x=>{const k=pretty(x.n).toLowerCase(),o=m.get(k);if(!o||(x.v??-1)>(o.v??-1))m.set(k,{...x,n:pretty(x.n)})});
 const arr=[...m.values()],vals=arr.map(x=>x.v).filter(v=>v!==null),mx=vals.length?Math.max(...vals):0,scale=mx<=5?5:mx<=10?10:null;
 return arr.map(x=>{
  let lvl,pct,label;
  if(x.v!==null){
   if(scale){const f=x.v/scale;lvl=f<=.3?0:f<=.6?1:f<=.8?2:3;pct=f*100}
   else{lvl=pLevel(x.v);pct=Math.min(100,x.v/1.2)}
   label=x.v===0?'None':LVL[lvl];
  }else{lvl=CATS[x.c];label=x.c[0].toUpperCase()+x.c.slice(1);pct=[18,45,75,100][lvl]}
  return{n:x.n,label,lvl,pct:Math.max(pct,5)};
 }).sort((a,b)=>b.lvl-a.lvl||b.pct-a.pct);
}

 finally{clearTimeout(t)}
}

async function getSpeciesMeta(){

let pollenOutlook=null;
const BAR_BASE=[12,38,62,85],BAR_SPAN=[24,24,23,15];
function speciesBar(s,lims){
 const risk=String(s.risk_level||'low').toLowerCase(),lvl=RISK[risk]??0,v=+s.value||0;
 const lowEdge=lvl>0?(lims[lvl-1]||0):0,highEdge=lims[lvl]||lims[lims.length-1]||1;
 const frac=lvl>=3?Math.min(1,v/highEdge):Math.max(0,Math.min(1,(v-lowEdge)/((highEdge-lowEdge)||1)));
 return{risk,lvl,v,pct:v===0?5:BAR_BASE[lvl]+BAR_SPAN[lvl]*frac};
}
async function pollenAtmospore(){
 if(atmoDead)return null;
 try{
  const dt=data.current.time.slice(0,10);
  const[j,meta]=await Promise.all([
   fetchJSON(`${ATMO.base}/pollen?lat=${place.lat}&lon=${place.lon}&dt=${dt}&forecast_days=5`),
   getSpeciesMeta()
  ]);
  console.info('[Atmospore]',j);
  const days=j.data||[],day=days[0];
  if(!day||!day.species)return null;
  const limsOf=id=>(meta[id]&&meta[id].risk_thresholds)||[];
  const nameOf=(id,s)=>s.display_name||(meta[id]&&meta[id].display_name)||id;

  let rows=Object.entries(day.species).map(([id,s])=>{
   const b=speciesBar(s,limsOf(id));
   return{n:nameOf(id,s),v:b.v,lvl:b.lvl,pct:b.pct,label:b.v===0?'None':b.risk[0].toUpperCase()+b.risk.slice(1)};
  }).sort((a,b)=>b.lvl-a.lvl||b.v-a.v);
  if(rows.some(r=>r.v>0))rows=rows.filter(r=>r.v>0);

  pollenOutlook=days.slice(0,5).map((d,i)=>{
   const list=Object.entries(d.species||{}).map(([id,s])=>({id,s,b:speciesBar(s,limsOf(id))})).sort((a,b)=>b.b.lvl-a.b.lvl||b.b.v-a.b.v);
   const top=list[0],ov=RISK[String(d.overall_risk||'low').toLowerCase()]??0;
   const lvl=Math.max(ov,top?top.b.lvl:0),none=!top||top.b.v===0;
   return{
    day:i?new Date(d.date+'T12:00').toLocaleDateString('en',{weekday:'short'}):'Today',
    lvl,pct:none?8:Math.max(top.b.pct,BAR_BASE[lvl]),
    label:none?'None':['Low','Moderate','High','Very high'][lvl]
   };
  });

  sig.pollen={risk:String(day.overall_risk||'low').toLowerCase(),top:rows[0]&&rows[0].n};
  return rows;
 }catch(e){
  console.warn('[Atmospore] failed:',e.message);
  atmoDead=true;
  return null;
 }
}
async function pollenOpenMeteo(){
 const keys=[['alder_pollen','Alder'],['birch_pollen','Birch'],['grass_pollen','Grass'],['mugwort_pollen','Mugwort'],['olive_pollen','Olive'],['ragweed_pollen','Ragweed']];
 const r=await fetch(`https://air-quality-api.open-meteo.com/v1/air-quality?latitude=${place.lat}&longitude=${place.lon}&current=${keys.map(k=>k[0]).join(',')}&timezone=auto`);
 const cur=(await r.json()).current||{};
 return keys.map(([k,n])=>{const v=cur[k];if(v==null)return null;const l=pLevel(v);return{n,label:v===0?'None':LVL[l],lvl:l,pct:Math.max(5,Math.min(100,v/1.2))}}).filter(Boolean).sort((a,b)=>b.lvl-a.lvl||b.pct-a.pct);
}
function pollenInsight(){
 const c=data.current,h=data.hourly,i0=idx0();
 const rain=Math.max(...h.precipitation_probability.slice(i0,i0+8)),v=c.wind_speed_10m,rh=c.relative_humidity_2m;
 if(rain>=60)return['drop','Rain is likely soon. It often rinses pollen out of the air, so levels can drop afterwards.'];
 if(v>=20&&rh<60)return['wind','Dry and windy: pollen travels far today, and levels can peak around midday.'];
 if(rh>=80)return['drop','Humid air makes pollen grains heavier, so they tend to settle closer to the ground.'];

}

 return`<div class="pdrift" aria-hidden="true">${grains}</div><h3>Pollen & allergies</h3><p class="note" style="margin:0 0 6px;font-size:15px">${adv}</p><div class="pl">${rows.slice(0,6).map((r,i)=>`<div class="pr"><span>${r.n}</span><div class="pb"><i class="lv${r.lvl}" style="--w:${r.pct}%;--n:${i}"></i></div><b>${r.label}</b></div>`).join('')}</div><div class="pins">${ic(ii)}<span>${it}</span></div>${out}<span class="src" style="align-self:flex-start;margin-top:14px">${source}</span>${note?`<p class="note" style="font-size:12px">${note}</p>`:''}`;
}

   cx.strokeStyle='rgba(235,245,255,.55)';cx.lineWidth=p.z;cx.beginPath();cx.moveTo(p.x,p.y);cx.lineTo(p.x-2*p.z,p.y+14*p.z);cx.stroke();

/* NASA IMERG: find the newest available times, then build an animation */
const nasaISO=t=>new Date(t).toISOString().slice(0,19)+'Z';
const NASA_URL=t=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/IMERG_Precipitation_Rate_30min/default/${nasaISO(t)}/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png`;
const NASA_PROBE=t=>NASA_URL(t).replace('{z}','0').replace('{y}','0').replace('{x}','0');
let nasaCache=null;
function imgOK(url){
 return new Promise(res=>{
  const im=new Image(),to=setTimeout(()=>{im.src='';res(false)},6000);
  im.onload=()=>{clearTimeout(to);res(true)};
  im.onerror=()=>{clearTimeout(to);res(false)};
  im.src=url;
 });
}
/* keep only frames whose image content is really different */
async function nasaDistinct(times){
 const sig=await Promise.all(times.map(async t=>{
  try{
   const r=await fetch(NASA_PROBE(t));
   if(!r.ok)return null;
   const b=new Uint8Array(await r.arrayBuffer());
   let h=2166136261;for(let i=0;i<b.length;i++){h^=b[i];h=Math.imul(h,16777619)}
   return(h>>>0)+':'+b.length;
  }catch(e){return undefined}   // undefined = couldn't check (e.g. CORS)
 }));
 if(sig.every(s=>s===undefined)){console.warn('[NASA IMERG] could not compare frames, keeping all');return times}
 const seen=new Set(),out=[];
 times.forEach((t,i)=>{if(sig[i]&&!seen.has(sig[i])){seen.add(sig[i]);out.push(t)}});
 console.info('[NASA IMERG] distinct frames:',out.length,'of',times.length);
 return out;
}

async function nasaTimes(){
 if(nasaCache&&Date.now()-nasaCache.at<9e5)return nasaCache.times;
 const step=30*60e3;
 try{
  const r=await fetch(ATMO.base.replace('/v1','')+'/imerg-latest');
  if(!r.ok)throw new Error('HTTP '+r.status);
  const latest=Date.parse((await r.json()).latest);
  if(!isFinite(latest))throw new Error('bad date');
  console.info('[NASA IMERG] newest frame:',nasaISO(latest),'=',((Date.now()-latest)/36e5).toFixed(1),'h ago');
  const times=await nasaDistinct(Array.from({length:12},(_,k)=>latest-(11-k)*step));
  nasaCache={at:Date.now(),times};return times;
 }catch(e){console.warn('[NASA IMERG] latest lookup failed:',e.message);return[]}
}
const satCache={};
const satURL=(id,j,t)=>`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${id}/default/${nasaISO(t)}/${j.tms}/{z}/{y}/{x}.${j.ext}`;

async function satProbe(cfg){            // fallback if the Worker has no /gibs-latest
  const step=10*60e3;
  let t=Math.floor(Date.now()/step)*step;
  for(let n=0;n<36;n++,t-=step){
    const u=`https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/${cfg.id}/default/${nasaISO(t)}/${cfg.tms}/3/3/2.${cfg.ext}`;
    try{
      const r=await fetch(u);
      if(r.ok&&(await r.blob()).size>1500)
        return{found:true,end:new Date(t).toISOString(),start:new Date(t-24*36e5).toISOString(),stepMs:step,tms:cfg.tms,ext:cfg.ext};
    }catch(e){}
  }
  throw new Error('no recent frames found');
}
async function satInfo(kind){
  const cfg=SAT_LAYERS[kind],c=satCache[kind];
  if(c&&Date.now()-c.at<6e5)return c.v;
  let v;
  try{
    const r=await fetch(ATMO.base.replace('/v1','')+'/gibs-latest?id='+cfg.id);
    if(!r.ok)throw new Error('HTTP '+r.status);
    v=await r.json();
    if(!v.found||!v.end||!v.stepMs||!v.tms)throw new Error('layer not found');
  }catch(e){
    console.warn('[SAT] worker lookup failed, probing GIBS directly:',e.message);
    v=await satProbe(cfg);
  }
  satCache[kind]={at:Date.now(),v};return v;
}

let nasaLeg=null;
async function nasaLegend(){
  if(!nasaLeg){
    const urls=['https://gibs.earthdata.nasa.gov/colormaps/v1.3/IMERG_Precipitation_Rate.xml',
                ATMO.base.replace('/v1','')+'/colormap'];
    for(const u of urls){
      try{
        const r=await fetch(u);if(!r.ok)throw new Error('HTTP '+r.status);
        const x=new DOMParser().parseFromString(await r.text(),'text/xml'),lg=x.querySelector('Legend');
        let cols=[...x.querySelectorAll('LegendEntry')].map(e=>e.getAttribute('rgb')).filter(Boolean);
        if(cols.length<2)cols=[...x.querySelectorAll('ColorMapEntry')].filter(e=>e.getAttribute('transparent')!='true').map(e=>e.getAttribute('rgb')).filter(Boolean);
        if(cols.length<2)throw new Error('no colours');
        const n=Math.min(24,cols.length);
        cols=Array.from({length:n},(_,i)=>cols[Math.round(i*(cols.length-1)/(n-1))]);
        nasaLeg={cols,min:lg&&lg.getAttribute('minLabel'),max:lg&&lg.getAttribute('maxLabel')};
        break;
      }catch(e){console.warn('[NASA legend] failed:',u,e.message)}
    }
    if(!nasaLeg)nasaLeg={cols:null};   // keeps the default CSS gradient
  }
  const bar=$('#rlbar');if(!bar)return;
  if(nasaLeg.cols)bar.style.background=`linear-gradient(90deg,${nasaLeg.cols.map(c=>`rgb(${c})`).join(',')})`;
  $('#rlmin').textContent=nasaLeg.min||'light';
  $('#rlmax').textContent=nasaLeg.max||'heavy';
}

async function radarLoadKind(k){
  if(!radarMap)return;
  const tok=radarTok,note=$('#rnote'),sl=$('#rsl'),pl=$('#rplay');
  clearTimeout(radarTimer);
  radarLayers.forEach(l=>radarMap.removeLayer(l));radarLayers=[];radarFrames=[];
  radarKind=k;$$('#rsw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.rk==k));
  $('#rleg').hidden=k!='rain';
  $('#rleg2').hidden=k!='nasa';
  if(k=='nasa')nasaLegend();
  note.textContent='';$('#rtime').textContent='';

  /* ---- Satellite (true colour) and Clouds (infrared), both from NASA GIBS ---- */
  if(k=='sat'||k=='cloud'){
    const cfg=SAT_LAYERS[k];
    sl.disabled=true;pl.disabled=true;
    note.textContent='Loading satellite frames…';
    let j;
    try{j=await satInfo(k)}catch(e){
      console.warn('[SAT]',e.message);
      if(tok===radarTok&&note)note.textContent='Satellite imagery unavailable right now.';
      return;
    }
    if(tok!==radarTok||!radarMap)return;
    const end=Date.parse(j.end),start=Date.parse(j.start),N=12;
    const times=Array.from({length:N},(_,i)=>end-(N-1-i)*j.stepMs).filter(t=>t>=start);
    const nz=+((j.tms.match(/Level(\d+)/)||[0,7])[1]);
    console.info('[SAT]',k,'newest frame:',nasaISO(end),'=',((Date.now()-end)/36e5).toFixed(1),'h ago');
    radarFrames=times.map(t=>({time:t/1000,fc:false}));
    radarLayers=times.map(t=>mkLayer(satURL(cfg.id,j,t),{maxNativeZoom:nz,maxZoom:9}));
    sl.disabled=false;pl.disabled=false;sl.max=times.length-1;
    const out=place.lon>10||place.lon<-150;
    note.textContent=(k=='sat'?'True-colour satellite':'Infrared satellite (clouds)')+' · GOES-East · last ~2 h'
      +(out?' · GOES-East only covers the Americas and the Atlantic':'');
    radarShow(0);radarBtn();radarTick();
    return;
  }

  /* ---- NASA IMERG ---- */
  if(k=='nasa'){
    sl.disabled=true;pl.disabled=true;
    note.textContent='Checking the latest satellite frames…';
    const times=await nasaTimes();
    if(tok!==radarTok||!radarMap)return;
    if(times.length<2){
      radarLayers=[L.tileLayer('https://gibs.earthdata.nasa.gov/wmts/epsg3857/best/IMERG_Precipitation_Rate_30min/default/default/GoogleMapsCompatible_Level6/{z}/{y}/{x}.png',
        {pane:'radar',className:'rlayer',opacity:.8,maxNativeZoom:6,maxZoom:9,errorTileUrl:BLANK}).addTo(radarMap)];
      radarFrames=[{}];sl.max=0;
      note.textContent='Satellite rain estimate · worldwide · latest image (no distinct frames to animate)';
      $('#rtime').textContent='Latest available';
      return;
    }
    radarFrames=times.map(t=>({time:t/1000,fc:false}));
    radarLayers=times.map(t=>mkLayer(NASA_URL(t),{maxNativeZoom:6,maxZoom:9}));
    sl.disabled=false;pl.disabled=false;sl.max=times.length-1;
    note.textContent='Satellite rain estimate · worldwide · last ~6 h';
    radarShow(0);radarBtn();radarTick();
    return;
  }

  /* ---- RainViewer radar ---- */
  sl.disabled=false;pl.disabled=false;
  let meta;
  try{meta=await radarGetMeta()}catch(e){if(tok===radarTok&&note)note.textContent='Radar service unavailable right now.';return}
  if(tok!==radarTok||!radarMap)return;
  const host=meta.host||'https://tilecache.rainviewer.com',rad=meta.radar||{};
  const frames=[...(rad.past||[]).slice(-8).map(f=>({...f,fc:false})),...(rad.nowcast||[]).map(f=>({...f,fc:true}))];
  if(!frames.length){note.textContent='No radar frames available right now.';return}
  radarFrames=frames;
  radarLayers=frames.map(f=>mkLayer(host+f.path+'/256/{z}/{x}/{y}/2/1_1.png',{tileSize:256,maxNativeZoom:7,maxZoom:9}));
  sl.max=frames.length-1;
  note.textContent=frames.some(f=>f.fc)?'Recent radar + short forecast':'Recent radar · updates every 10 min';
  radarShow(0);radarBtn();radarTick();
}

/* ============ PWA install ============ */
let installEv=null;
addEventListener('beforeinstallprompt',e=>{e.preventDefault();installEv=e;$('#inst').hidden=false});
$('#inst').onclick=async()=>{
 if(!installEv)return;
 installEv.prompt();
 const r=await installEv.userChoice;
 installEv=null;$('#inst').hidden=true;
 toast(r.outcome=='accepted'?'Installing Skylab…':'No problem, maybe later');
};
addEventListener('appinstalled',()=>{installEv=null;$('#inst').hidden=true;toast('Skylab installed')});
if('serviceWorker' in navigator&&location.protocol=='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});

/* ============ boot ============ */
const saved=lsGet('place');
if(saved)show(saved.lat,saved.lon,saved.name,saved.sub);else landing();
</script>
